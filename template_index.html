        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

        nav {

        }

        }
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            margin-left: 30px;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #fff; }
        
        /* Hero 区域 */
        .hero {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            color: #fff;
            padding: 160px 20px 100px;
            text-align: center;
        }
        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .hero .subtitle {
            font-size: 18px;
            margin-bottom: 30px;
            color: #bbb;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .hero-tags {
            display: flex;
            justify-content: center;

            flex-wrap: wrap;
        }
        .hero-tag {

            font-size: 14px;
            color: #ddd;
            border: 1px solid rgba(255,255,255,0.15);
        }
        
        /* 内容区域 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .tool-section {
            padding: 80px 20px;
            background: #f5f5f5;
        }
        .section-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 15px;
            color: #000;
        }
        .section-subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 50px;
            font-size: 16px;
        }
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }
        .tool-card {
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
        }
        .tool-preview {
            height: 160px;
            background: linear-gradient(135deg, #444 0%, #222 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
        }
        .tool-info {
            padding: 25px;
        }
        .tool-info h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #000;
        }
        .tool-info p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .tool-btn {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            transition: background 0.3s;
        }
        .tool-btn:hover {
            background: #333;
        }
        
        
        /* 页脚 */
        footer {
            background: #111;
            color: #666;
            text-align: center;
            padding: 40px 20px;
        }
        footer p { margin-bottom: 8px; }
        footer a { color: #888; text-decoration: none; }
        footer a:hover { color: #fff; }

        /* 汉堡菜单 */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 4px;
            background: none;
            border: none;
        }
        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
        .mobile-menu {
            display: none;
            position: fixed;
            top: 54px;
            left: 0;
            width: 100%;
            background: #000;
            z-index: 99;
            padding: 10px 0 20px;
            border-top: 1px solid #222;
        }
        .mobile-menu.open { display: block; }
        .mobile-menu a {
            display: block;
            color: #aaa;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 16px;
            transition: color 0.3s;
        }
        .mobile-menu a:hover { color: #fff; }

        @media (max-width: 768px) {
            .tool-card { flex-direction: column; }
            .tool-preview { min-height: 200px; }
            .hero h1 { font-size: 32px; }
            .nav-links { display: none; }
            .hamburger { display: flex; }
        }
    </style>
